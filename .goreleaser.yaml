# goreleaser v2. Release: git tag vX.Y.Z && git push --tags (see README, Releasing).
version: 2
project_name: pair

before:
  hooks:
    - go mod tidy

builds:
  - id: pair
    main: ./cmd/pair
    binary: pair
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: pair
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - nvim/**

checksum:
  name_template: checksums.txt

# The source stays private: the release and the cask go to two public
# repositories, with a token that can write to those two only
# (RELEASE_GITHUB_TOKEN). The commit log is not published with them.
changelog:
  disable: true

release:
  github:
    owner: fabioaraujo121
    name: pair-releases
    token: "{{ .Env.RELEASE_GITHUB_TOKEN }}"
  draft: false
  prerelease: auto
  header: |
    Voice-driven pairing with a coding agent (Claude Code, Codex) in the terminal.

    ```sh
    brew tap fabioaraujo121/tap && brew install --cask pair
    ```

# Homebrew: goreleaser's `brews` (formula) is deprecated since v2.10; casks
# carry pre-built binaries and can depend on formulae.
homebrew_casks:
  - name: pair
    binaries:
      - pair
    homepage: https://github.com/fabioaraujo121/pair-releases
    description: Voice-driven pairing with a coding agent (Claude Code, Codex) in the terminal
    license: MIT
    directory: Casks
    skip_upload: auto
    repository:
      owner: fabioaraujo121
      name: homebrew-tap
      branch: main
      token: "{{ .Env.RELEASE_GITHUB_TOKEN }}"
    dependencies:
      - formula: whisper.cpp
      - formula: sox
      - formula: tmux
      - formula: neovim
    caveats: |
      Once per machine: `pair setup` checks the dependencies, downloads the
      whisper model (about 550 MB), asks for microphone access and tests the
      voice. Then, in a repository: `pair`.
      Recommended: brew install git-delta (pretty diffs) and
      brew install --cask hammerspoon (global push-to-talk hotkeys).
    hooks:
      post:
        # The binary is not notarized: strip the quarantine flag so Gatekeeper
        # lets it run.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pair"]
          end
